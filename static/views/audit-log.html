<!-- Audit Trail -->
<template>

    <div class="view-header">

        <div>
            <h1>Audit Trail</h1>
            <p>Track every administrative activity performed across the TOYP platform.</p>
        </div>

        <div class="header-actions">

            <button class="view-btn" id="refresh-audit">
                <i class='bx bx-refresh'></i>
                Refresh
            </button>

            <button class="btn-primary" id="export-audit">
                <i class='bx bx-export'></i>
                Export CSV
            </button>

        </div>

    </div>

    <!-- ============================= -->
    <!-- Statistics -->
    <!-- ============================= -->

    <div class="stats-grid">

        <div class="stat-card">

            <div class="stat-info">

                <span>Total Activities</span>

                <h2 id="audit-total">0</h2>

            </div>

            <i class='bx bx-history'></i>

        </div>

        <div class="stat-card">

            <div class="stat-info">

                <span>Today's Activities</span>

                <h2 id="audit-today">0</h2>

            </div>

            <i class='bx bx-calendar'></i>

        </div>

        <div class="stat-card">

            <div class="stat-info">

                <span>Failed Operations</span>

                <h2 id="audit-failed">0</h2>

            </div>

            <i class='bx bx-error-circle'></i>

        </div>

        <div class="stat-card">

            <div class="stat-info">

                <span>Administrators</span>

                <h2 id="audit-admins">0</h2>

            </div>

            <i class='bx bx-user'></i>

        </div>

    </div>

    <!-- ============================= -->
    <!-- Search & Filters -->
    <!-- ============================= -->

    <div class="card" style="margin-top:25px;">

        <div style="
            display:flex;
            gap:15px;
            flex-wrap:wrap;
            align-items:center;
        ">

            <input
                id="audit-search"
                class="search-input"
                type="text"
                placeholder="Search logs...">

            <select id="audit-module">

                <option value="">All Modules</option>

                <option>Nominations</option>

                <option>Categories</option>

                <option>Voting</option>

                <option>Results</option>

                <option>CMS</option>

                <option>Authentication</option>

            </select>

            <select id="audit-status">

                <option value="">All Status</option>

                <option>Success</option>

                <option>Failed</option>

                <option>Warning</option>

            </select>

            <input
                id="audit-date"
                type="date">

        </div>

    </div>

    <!-- ============================= -->
    <!-- Audit Table -->
    <!-- ============================= -->

    <div class="card" style="margin-top:25px;">

        <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        ">

            <h3>System Audit Log</h3>

            <span id="audit-count">

                0 Records

            </span>

        </div>

        <div class="table-responsive">

            <table style="width:100%;border-collapse:collapse;min-width:1200px;">

                <thead>

                    <tr>

                        <th>Date</th>

                        <th>Time</th>

                        <th>Administrator</th>

                        <th>Action</th>

                        <th>Module</th>

                        <th>IP Address</th>

                        <th>Status</th>

                    </tr>

                </thead>

                <tbody id="logs-table-body">

                    <tr class="loading-row">

                        <td colspan="7"
                            style="
                            text-align:center;
                            padding:30px;
                            color:var(--text-muted);
                        ">

                            Loading audit records...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

    <!-- ============================= -->
    <!-- Pagination -->
    <!-- ============================= -->

    <div class="card" style="margin-top:20px;">

        <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:15px;
        ">

            <span id="audit-pagination-info">

                Showing 0 - 0 of 0

            </span>

            <div style="display:flex;gap:10px;">

                <button class="view-btn" id="audit-prev">

                    Previous

                </button>

                <button class="view-btn" id="audit-next">

                    Next

                </button>

            </div>

        </div>

    </div>

</template>
